<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Static Character Runtime · V0.1</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="stage-panel" aria-label="角色展示区">
        <div class="stage">
          <div class="stage-glow"></div>
          <img class="character-layer" alt="" />
          <img class="character-layer" alt="" />
        </div>
        <div class="current-card">
          <span class="eyebrow">当前状态</span>
          <strong id="current-label">正在加载……</strong>
          <code id="current-id">loading</code>
          <p id="current-description">正在读取角色清单。</p>
          <div class="state-details">
            <span>基础：<code id="base-state">-</code></span>
            <span>覆盖：<code id="override-state">无</code></span>
          </div>
        </div>
      </section>

      <aside class="control-panel">
        <header>
          <p class="eyebrow">Static Character Runtime · V0.1</p>
          <h1 id="character-name">角色加载器</h1>
          <p class="intro">从角色清单生成状态按钮，并在完整立绘之间平滑切换。</p>
        </header>
        <div id="status-message" class="status-message" role="status"></div>
        <button id="clear-overrides" class="secondary-button" type="button">清除临时状态</button>

        <details class="transition-editor">
          <summary>过渡编辑器</summary>
          <div class="editor-grid">
            <label>
              动画类型
              <select id="transition-type">
                <option value="crossfade">淡入淡出</option>
                <option value="bounce">弹跳</option>
                <option value="pop">弹出</option>
                <option value="none">无动画</option>
              </select>
            </label>
            <label>
              时长 <output id="transition-duration-value">220 ms</output>
              <input id="transition-duration" type="range" min="0" max="5000" step="10" />
            </label>
            <label id="transition-distance-row">
              弹跳幅度 <output id="transition-distance-value">18 px</output>
              <input id="transition-distance" type="range" min="0" max="200" step="1" />
            </label>
          </div>
          <div class="editor-actions">
            <button id="preview-transition" class="secondary-button" type="button">预览动画</button>
            <button id="reset-transition" class="secondary-button" type="button">恢复角色配置</button>
          </div>
          <p>仅调整当前页面预览，不会修改角色配置文件。</p>
        </details>
        <div id="state-groups" class="state-groups"></div>
        <footer>
          <span id="manifest-path"></span>
        </footer>
      </aside>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
